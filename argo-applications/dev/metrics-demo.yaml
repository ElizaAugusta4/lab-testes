apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-demo
  namespace: argocd
spec:
  project: lab
  source:
    repoURL: https://github.com/ElizaAugusta4/lab-testes.git
    targetRevision: main
    path: agriness-helm/generic-app
    helm:
      valueFiles:
        - ../../application-manifests/dev/demo-apps/metrics-demo/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
