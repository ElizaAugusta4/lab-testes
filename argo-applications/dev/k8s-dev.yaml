apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-dev
  namespace: argocd
spec:
  project: lab
  source:
    repoURL: https://github.com/ElizaAugusta4/lab-testes.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
