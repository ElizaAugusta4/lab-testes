# Banco de dados pra API - roda DENTRO do cluster, sem custo de Cloud SQL
# separado. Sem volume persistente de proposito (emptyDir): se o pod
# reiniciar, os dados somem - e um otimo incidente pra documentar depois.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: demo-apps
type: Opaque
stringData:
  POSTGRES_USER: orders_api
  POSTGRES_PASSWORD: "troque-essa-senha-lab"
  POSTGRES_DB: ordersdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: demo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo-apps
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP