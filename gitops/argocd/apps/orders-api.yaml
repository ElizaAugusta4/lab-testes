apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-api
  namespace: argocd
spec:
  project: lab
  source:
    repoURL: https://github.com/ElizaAugusta4/lab-testes.git
    targetRevision: main
    path: helm/charts/generic-app
    helm:
      valueFiles:
        - ../../apps/orders-api/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
