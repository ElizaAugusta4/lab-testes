# Multi-source: o chart vem do repositorio publico da comunidade, mas o
# values.yaml vem do NOSSO repositorio - por isso "sources" (plural),
# nao "source". O "$values" e um apelido que o segundo source ganha,
# usado dentro do primeiro pra apontar o arquivo certo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: lab
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/helm/values/kube-prometheus-stack/dev.yaml
    - repoURL: https://github.com/ElizaAugusta4/lab-testes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
