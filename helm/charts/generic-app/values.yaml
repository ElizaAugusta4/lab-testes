replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""

containerPort: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

env: []
# - name: DB_HOST
#   value: postgres
# - name: DB_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: postgres-credentials
#       key: POSTGRES_PASSWORD

probes:
  enabled: false
  readinessPath: /readyz
  livenessPath: /healthz

service:
  enabled: true
  port: 80
  targetPort: 80

serviceMonitor:
  enabled: false
  path: /metrics
  interval: 15s
  releaseLabel: kube-prometheus-stack

ingress:
  enabled: false
  host: ""
  staticIpName: ""
