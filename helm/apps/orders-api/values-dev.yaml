nameOverride: orders-api

image:
  repository: southamerica-east1-docker.pkg.dev/postgres-observability/lab-images/orders-api
  tag: latest

containerPort: 8000

env:
  - name: DB_HOST
    value: postgres
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_DB
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_USER
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_PASSWORD

probes:
  enabled: true
  readinessPath: /readyz
  livenessPath: /healthz

service:
  port: 8000
  targetPort: 8000

serviceMonitor:
  enabled: true
  path: /metrics

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 200m
    memory: 192Mi
