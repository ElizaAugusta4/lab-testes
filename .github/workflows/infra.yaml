name: Infraestrutura

on:
  pull_request:
    paths:
      - "infraestrutura/terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "O que rodar"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  WORKING_DIR: infraestrutura/terraform/environments/dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt (checa formatacao)
        working-directory: infraestrutura/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform validate (checa sintaxe/consistencia)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init -backend=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint (boas praticas)
        working-directory: infraestrutura/terraform
        run: |
          tflint --init
          tflint --recursive

  terraform:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        if: github.event_name ==